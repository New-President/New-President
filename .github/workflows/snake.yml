name: Generate Snake Animation

on:
  schedule:
    # Run once every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "resources/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          palette: github-dark
          outputs: |
            resources/grid-snake.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/grid-snake.svg
          if git diff --staged --quiet; then
            echo "No changes in snake animation"
          else
            git commit -m "chore: update contribution snake animation [skip ci]"
            git push
          fi

